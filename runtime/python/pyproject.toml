[project]
name = "tasteduel-api-runtime"
version = "0.1.0"
description = "Minimal Taste Duel API runtime; no legacy planner or embedding dependencies"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "sqlalchemy==2.1.6",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.1",
  "google-cloud-secret-manager==2.31.0",
  "google-genai==2.33.0",
  "httpx==0.28.1",
]

[tool.uv]
package = false
