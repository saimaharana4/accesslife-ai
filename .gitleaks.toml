[extend]
useDefault = true

[[allowlists]]
description = "Exact empty Secret Manager bindings and stable synthetic identifiers"
regexTarget = "line"
regexes = [
  '''^QLOO_API_KEY_SECRET=$''',
  '''^OPENAI_API_KEY_SECRET=$''',
  '''^TFL_API_KEY_SECRET=$''',
  '''^CTA_API_KEY_SECRET=$''',
  '''^const storageKey = "tasteduel\.generation-intent\.v1";$''',
  '''^\s*key === "tasteduel\.generation-intent\.v1" \|\|$''',
  '''^\s*headers=\{"Idempotency-Key": "synthetic-prompt11-save"\},$''',
]

[[allowlists]]
description = "Public storage namespace and exact historical Cloud Run revision names, never credentials"
regexTarget = "secret"
regexes = [
  '''^tasteduel\.generation-intent\.v1$''',
  '''^synthetic-(prompt11|discovery)-save$''',
  '''^tasteduel-api-(00005-kdm|r19c-e49564c|r19p-e49564c|r19r-e49564c|hf[cs]-[a-f0-9]{7}|nb[cs]-8885e31|nf[cs]-e010748)$''',
]
