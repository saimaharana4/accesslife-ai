name: Taste Duel production verification
run-name: Taste Duel production checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tasteduel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Synthetic contracts, runtime, browser and infra checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONPATH: .:apps/api/src
      TASTEDUEL_QLOO_ENABLED: "false"
      TASTEDUEL_GENERATION_ENABLED: "false"
      TASTEDUEL_TEST_DATABASE_URL: postgresql+psycopg://tasteduel_runtime:local_only_tasteduel_runtime@127.0.0.1:55436/tasteduel_prompt5
      TASTEDUEL_TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://tasteduel_migrator:local_only_tasteduel_migrator@127.0.0.1:55436/tasteduel_prompt5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Preservation contracts inspect the immutable pre-foundation baseline.
          fetch-depth: 0

      - name: Install Node 24.18.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.32
          enable-cache: true
          cache-dependency-glob: runtime/python/uv.lock

      - name: Install locked application and test dependencies
        run: |
          corepack pnpm install --frozen-lockfile
          uv sync --project runtime/python --frozen --group dev
          npm ci --prefix runtime/qloo --ignore-scripts --no-audit --no-fund

      - name: Lint Python and TypeScript sources
        run: |
          uv run --project runtime/python --frozen ruff check apps/api/src/tasteduel tests/tasteduel scripts
          corepack pnpm exec prettier --check .github/workflows/ci.yml .github/workflows/cloud-release.yml apps/web/src

      - name: Run web contracts and isolated state checks
        run: |
          corepack pnpm test:web-contracts
          corepack pnpm test:fixture-state
          node --test runtime/qloo/typed-response.test.mjs
          node --test tests/browser-contracts/*.test.mjs

      - name: Start isolated Taste Duel PostgreSQL
        run: docker compose -p taste-duel --env-file compose.tasteduel.env -f compose.yaml up --detach --wait database

      - name: Apply the immutable Taste Duel migrations
        run: docker compose -p taste-duel --env-file compose.tasteduel.env -f compose.yaml run --rm migrate

      - name: Run provider contracts and real PostgreSQL integration tests
        env:
          TASTEDUEL_QLOO_ENABLED: "false"
          TASTEDUEL_GENERATION_ENABLED: "false"
        run: uv run --project runtime/python --frozen pytest -c pytest.tasteduel.ini --confcutdir=tests/tasteduel tests/tasteduel -q

      - name: Check generated OpenAPI and TypeScript contracts
        run: |
          uv run --project runtime/python --frozen python scripts/export_contracts.py
          corepack pnpm exec openapi-typescript packages/contracts/openapi.json -o apps/web/src/lib/api/schema.d.ts
          corepack pnpm exec prettier --write apps/web/src/lib/api/schema.d.ts
          git diff --exit-code -- packages/contracts/openapi.json apps/web/src/lib/api/schema.d.ts

      - name: Run strict TypeScript checks and production build
        run: |
          corepack pnpm typecheck
          corepack pnpm build
          corepack pnpm check:fixture-production
          corepack pnpm exec tsc --noEmit --skipLibCheck --esModuleInterop --moduleResolution bundler --module esnext --target es2022 --typeRoots apps/web/node_modules/@types --types node tests/e2e/tasteduel-cloud.spec.ts tests/e2e/tasteduel-cloud-replay.spec.ts tests/e2e/tasteduel-cloud-postchecks.spec.ts playwright.cloud.config.ts

      - name: Build and smoke test immutable local containers
        run: |
          docker compose -p taste-duel --env-file compose.tasteduel.env -f compose.yaml build api web
          docker compose -p taste-duel --env-file compose.tasteduel.env -f compose.yaml up --detach --wait api web
          curl --fail --silent --show-error http://127.0.0.1:18005/v1/health/live
          curl --fail --silent --show-error http://127.0.0.1:13001/ --output /dev/null
          curl --fail --silent --show-error http://127.0.0.1:13001/art/afterlight.svg --output /dev/null

      - name: Run complete desktop, mobile and narrow-reflow Playwright plus full axe scans
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm exec playwright install --with-deps chromium
          corepack pnpm dev:fixtures > /tmp/tasteduel-fixtures.log 2>&1 &
          fixture_pid=$!
          cleanup_fixture() { kill "$fixture_pid" 2>/dev/null || true; }
          trap cleanup_fixture EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3001/ >/dev/null; then break; fi
            if [ "$attempt" = 60 ]; then cat /tmp/tasteduel-fixtures.log; exit 1; fi
            sleep 2
          done
          TASTEDUEL_FIXTURE_URL=http://127.0.0.1:3001 corepack pnpm test:fixtures
          # Browser journeys mock only the browser API. Run them against the
          # real production-mode web shell, not the separate fictional demo.
          TASTEDUEL_TEST_WEB_URL=http://127.0.0.1:13001 corepack pnpm test:audit
          TASTEDUEL_TEST_WEB_URL=http://127.0.0.1:13001 corepack pnpm test:challenges

      - name: Scan tracked source for secrets
        shell: bash
        run: |
          set -euo pipefail
          tracked_source="$(mktemp -d)"
          trap 'rm -rf "$tracked_source"' EXIT
          git archive --format=tar HEAD | tar -xf - -C "$tracked_source"
          docker run --rm -v "$tracked_source:/repo:ro" zricethezav/gitleaks:v8.28.0 detect --source /repo --config /repo/.gitleaks.toml --no-git --redact --exit-code 1

      - name: Validate Terraform without a backend or credentials
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - name: Initialize and statically validate Terraform
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/terraform validate -no-color

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tasteduel-playwright-evidence-${{ github.sha }}
          path: |
            test-results/tasteduel-fixtures/
            test-results/tasteduel-prompt13/
            test-results/tasteduel-prompt12/
            playwright-report/tasteduel-fixtures/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop containers and retain the project volume
        if: always()
        run: docker compose -p taste-duel --env-file compose.tasteduel.env -f compose.yaml down
