name: Taste Duel production verification
run-name: Taste Duel production checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tasteduel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Application, security and accessibility verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONPATH: .:apps/api/src
      TASTEDUEL_QLOO_ENABLED: "false"
      TASTEDUEL_GENERATION_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Preservation contracts inspect the immutable pre-foundation baseline.
          fetch-depth: 0

      - name: Install Node 24.18.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.32
          enable-cache: true
          cache-dependency-glob: runtime/python/uv.lock

      - name: Install locked application and test dependencies
        run: |
          corepack pnpm install --frozen-lockfile
          uv sync --project runtime/python --frozen --group dev
          npm ci --prefix runtime/qloo --ignore-scripts --no-audit --no-fund

      - name: Generate disposable database credentials
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets
          credentials = {role: secrets.token_hex(24) for role in ("ADMIN", "MIGRATOR", "RUNTIME")}
          values = {f"TASTEDUEL_LOCAL_{role}_PASSWORD": value for role, value in credentials.items()}
          values["TASTEDUEL_TEST_DATABASE_URL"] = f"postgresql+psycopg://tasteduel_runtime:{credentials['RUNTIME']}@127.0.0.1:55436/tasteduel_local"
          values["TASTEDUEL_TEST_MIGRATION_DATABASE_URL"] = f"postgresql+psycopg://tasteduel_migrator:{credentials['MIGRATOR']}@127.0.0.1:55436/tasteduel_local"
          for value in values.values():
              print(f"::add-mask::{value}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for name, value in values.items():
                  output.write(f"{name}={value}\n")
          PY

      - name: Lint Python and TypeScript sources
        run: |
          uv run --project runtime/python --frozen ruff check --config quality/ruff.toml apps/api/src/tasteduel quality/tasteduel scripts
          corepack pnpm exec prettier --check .github/workflows/ci.yml .github/workflows/cloud-release.yml apps/web/src

      - name: Run web contracts and isolated state checks
        run: |
          corepack pnpm test:web-contracts
          corepack pnpm test:fixture-state
          node --test runtime/qloo/typed-response.test.mjs
          node --test quality/browser-contracts/*.test.mjs

      - name: Start isolated Taste Duel PostgreSQL
        run: docker compose -p taste-duel --env-file infra/local/compose.tasteduel.env -f infra/local/compose.yaml up --detach --wait database

      - name: Verify populated legacy replay upgrade and transactional rollback
        run: uv run --project runtime/python --frozen python scripts/tasteduel_verify_named_upgrade.py

      - name: Apply the immutable Taste Duel migrations
        run: docker compose -p taste-duel --env-file infra/local/compose.tasteduel.env -f infra/local/compose.yaml run --rm migrate

      - name: Run provider contracts and real PostgreSQL integration tests
        env:
          TASTEDUEL_QLOO_ENABLED: "false"
          TASTEDUEL_GENERATION_ENABLED: "false"
        run: uv run --project runtime/python --frozen pytest -c quality/pytest.ini --confcutdir=quality/tasteduel quality/tasteduel -q

      - name: Check generated OpenAPI and TypeScript contracts
        run: |
          uv run --project runtime/python --frozen python scripts/export_contracts.py
          corepack pnpm exec openapi-typescript packages/contracts/openapi.json -o apps/web/src/lib/api/schema.d.ts
          corepack pnpm exec prettier --write apps/web/src/lib/api/schema.d.ts
          git diff --exit-code -- packages/contracts/openapi.json apps/web/src/lib/api/schema.d.ts

      - name: Run strict TypeScript checks and production build
        run: |
          corepack pnpm typecheck
          corepack pnpm build
          corepack pnpm check:fixture-production
          corepack pnpm exec tsc --noEmit --skipLibCheck --esModuleInterop --moduleResolution bundler --module esnext --target es2022 --typeRoots apps/web/node_modules/@types --types node quality/e2e/tasteduel-cloud.spec.ts quality/e2e/tasteduel-cloud-replay.spec.ts quality/e2e/tasteduel-cloud-postchecks.spec.ts quality/playwright.cloud.config.ts

      - name: Build and smoke test immutable local containers
        run: |
          docker compose -p taste-duel --env-file infra/local/compose.tasteduel.env -f infra/local/compose.yaml build api web
          docker compose -p taste-duel --env-file infra/local/compose.tasteduel.env -f infra/local/compose.yaml up --detach --wait api web
          curl --fail --silent --show-error http://127.0.0.1:18005/v1/health/live
          curl --fail --silent --show-error http://127.0.0.1:13001/ --output /dev/null
          curl --fail --silent --show-error http://127.0.0.1:13001/art/afterlight.svg --output /dev/null

      - name: Run complete desktop, mobile and narrow-reflow Playwright plus full axe scans
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm exec playwright install --with-deps chromium
          corepack pnpm dev:fixtures > /tmp/tasteduel-fixtures.log 2>&1 &
          fixture_pid=$!
          cleanup_fixture() { kill "$fixture_pid" 2>/dev/null || true; }
          trap cleanup_fixture EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3001/ >/dev/null; then break; fi
            if [ "$attempt" = 60 ]; then cat /tmp/tasteduel-fixtures.log; exit 1; fi
            sleep 2
          done
          TASTEDUEL_FIXTURE_URL=http://127.0.0.1:3001 corepack pnpm test:fixtures
          # Browser journeys mock only the browser API. Run them against the
          # real production-mode web shell, not the separate fictional demo.
          TASTEDUEL_TEST_WEB_URL=http://127.0.0.1:13001 corepack pnpm test:audit
          TASTEDUEL_TEST_WEB_URL=http://127.0.0.1:13001 corepack pnpm test:challenges
          TASTEDUEL_LIVE_WEB_URL=http://127.0.0.1:13001 corepack pnpm exec playwright test --config quality/playwright.live.config.ts --grep "preparation failure|insufficient coverage"

      - name: Scan tracked source for secrets
        shell: bash
        run: |
          set -euo pipefail
          tracked_source="$(mktemp -d)"
          canary_source="$(mktemp -d)"
          trap 'rm -rf "$tracked_source" "$canary_source"' EXIT
          git archive --format=tar HEAD | tar -xf - -C "$tracked_source"
          python - "$canary_source" <<'PY'
          from pathlib import Path
          import secrets
          import string
          import sys
          # Never-issued synthetic token. This must be detected by the real scanner.
          token = "ghp_" + "".join(secrets.choice(string.ascii_letters + string.digits) for _ in range(36))
          (Path(sys.argv[1]) / "canary.txt").write_text("GITHUB_TOKEN=" + token)
          PY
          if docker run --rm -v "$canary_source:/canary:ro" -v "$tracked_source/.github/security/gitleaks.toml:/config.toml:ro" zricethezav/gitleaks:v8.28.0 detect --source /canary --config /config.toml --no-git --redact --exit-code 1; then
            echo 'Secret scanner missed the synthetic canary.'
            exit 1
          else
            result=$?
            if [ "$result" -ne 1 ]; then exit "$result"; fi
          fi
          docker run --rm -v "$tracked_source:/repo:ro" zricethezav/gitleaks:v8.28.0 detect --source /repo --config /repo/.github/security/gitleaks.toml --no-git --redact --exit-code 1

      - name: Validate Terraform without a backend or credentials
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - name: Initialize and statically validate Terraform
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/terraform validate -no-color

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tasteduel-playwright-evidence-${{ github.sha }}
          path: |
            test-results/tasteduel-fixtures/
            test-results/tasteduel-audit/
            test-results/tasteduel-challenges/
            test-results/tasteduel-integration/
            playwright-report/tasteduel-fixtures/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop containers and retain the project volume
        if: always()
        run: docker compose -p taste-duel --env-file infra/local/compose.tasteduel.env -f infra/local/compose.yaml down
