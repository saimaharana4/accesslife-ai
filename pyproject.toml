[project]
name = "accesslife-api"
version = "0.1.0"
description = "Evidence-led local outing planner"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "httpx>=0.28,<1",
  "langgraph>=1,<2",
  "google-genai>=2,<3",
  "google-cloud-tasks>=2.19,<3",
  "google-auth>=2.38,<3",
  "openai>=2,<3",
  "pgvector>=0.4,<1",
  "beautifulsoup4>=4.13,<5",
  "google-cloud-secret-manager>=2.24,<3",
]

[project.optional-dependencies]
retrieval = ["onnxruntime>=1.22,<2", "tokenizers>=0.22,<1", "numpy>=2,<3", "huggingface-hub>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
